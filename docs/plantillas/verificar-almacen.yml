# Plantilla de GitHub Actions para el repo del ALMACÉN de registros de Oracle Factory: copiala a .github/workflows/verificar.yml
# del almacén y poné en PRODUCTO el repo del producto (dueño/nombre). Clona el almacén y el producto (con su historia, para ver
# los candidatos) y corre `oracle-factory verificar` sobre los dos: sólo lee, sin secretos. Un producto privado necesita además
# una clave de lectura (ver docs/ci.md).
# Política: si algún cambio está inconsistente, falla en main y avisa (sin fallar) en las demás ramas y pull requests.
name: Verificar los registros de Factory
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PRODUCTO: Segtem/oracle-factory
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: almacen
      - uses: actions/checkout@v6
        with:
          repository: ${{ env.PRODUCTO }}
          path: producto
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install ./producto
      - name: Verificar los registros (falla en main, avisa en las demás ramas)
        run: |
          rc=0
          oracle-factory --proyecto producto --registros almacen verificar || rc=$?
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$GITHUB_REF" = refs/heads/main ]; then exit "$rc"; fi
          echo "::warning title=verificar::Hay cambios inconsistentes (el detalle está arriba). En main esto falla; en una rama de trabajo es esperable hasta que se renueve la revisión."
